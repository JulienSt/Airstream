name: Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          # cache: "npm"
      - name: Install Node.js test dependencies
        run: npm install
      - name: Setup JVM
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup SBT
        uses: sbt/setup-sbt@v1
      - name: Run tests
        run: sbt +test
      - name: Test JavaScript regression checker
        run: python3 -m unittest scripts/tests/test_check_js_regression.py
      - name: Test Native port diff checker
        run: python3 -m unittest scripts/tests/test_report_port_diff.py
      - name: Check Native port review surface
        run: python3 scripts/report_port_diff.py
      - name: Compare JavaScript build with pre-port Airstream
        run: python3 scripts/check_js_regression.py
